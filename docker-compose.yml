services:

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile

    container_name: parampara-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend


  backend:
    build:
      context: .
      dockerfile: parampara-api/backend.Dockerfile

    container_name: parampara-backend

    ports:
      - "3000:3000"

    environment:
      PORT: 3000

      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: parampara
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD}

      SESSION_SECRET: ${SESSION_SECRET}

      FRONTEND_ORIGINS: http://localhost:8080

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}

    volumes:
      - parampara_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16-alpine

    container_name: parampara-postgres

    environment:
      POSTGRES_DB: parampara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - parampara_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parampara"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  parampara_postgres_data:
  parampara_uploads: