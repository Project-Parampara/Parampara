    function selectVoice(langCode) {
      const voices = speechSynthesis.getVoices();
      return voices.find(v => v.lang.toLowerCase().startsWith(langCode.toLowerCase())) || null;
    }

    function showVR() {
      const container = document.getElementById('vrContainer');
      const captionDiv = document.getElementById('vrCaption');
      const siteData = (vrData[district] && vrData[district][site]) ? vrData[district][site] : null;

      if (siteData && siteData.url) {
        // use template literal and escape properly
        container.innerHTML = `<iframe src="${siteData.url}" allow="autoplay; fullscreen; vr; xr-spatial-tracking" allowfullscreen></iframe>`;
        captionDiv.innerHTML = siteData.caption;
      } else {
        container.innerHTML = "<p style='color:white;'>No AR/VR model available for this site.</p>";
        captionDiv.innerHTML = "";
      }
    }

    showVR();

    let utterance = null;
    document.getElementById('playVoice').addEventListener('click', () => {
      const lang = document.getElementById('langSelect').value;
      const siteData = (vrData[district] && vrData[district][site]) ? vrData[district][site] : null;
      const text = (siteData && siteData.audio && siteData.audio[lang]) ? siteData.audio[lang] : '';

      if (!text) return alert("No audio text available for this site/language.");

      if (utterance) speechSynthesis.cancel();
      utterance = new SpeechSynthesisUtterance(text);

      const langCode = lang === 'en' ? 'en-IN' : (lang === 'hi' ? 'hi-IN' : 'kn-IN');
      utterance.lang = langCode;

      const voice = selectVoice(langCode);
      if (voice) utterance.voice = voice;

      speechSynthesis.speak(utterance);
