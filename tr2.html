<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive India Map - States & Districts</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('images/Main_india.jpeg') no-repeat center center;
  background-size: cover;
}
    svg {
      width: 100%;
      height: calc(100vh - 50px);
      display: block;
    }
    .controls {
      width: 100%;
      height: 50px;
      background: #0e0e013c;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-sizing: border-box;
    }
    .back-btn {
      background: #ab8449;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: none;
    }
    .back-btn:hover {
      background: #e68900;
    }
    .back-btn.active {
      display: block;
    }
    .title {
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin-left: 20px;
      flex: 1;
    }
    .state {
      fill: #ffc107;
      stroke: #333;
      stroke-width: 0.5;
      cursor: pointer;
      transition: fill 0.2s ease-in-out;
    }
    .state:hover {
      fill: #4ec752;
    }
    .district {
      fill: #90caf9;
      stroke: #333;
      stroke-width: 0.4;
      cursor: pointer;
      transition: fill 0.2s ease-in-out;
    }
    .district:hover {
      fill: #ff5722;
    }
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: none;
      font-size: 13px;
      opacity: 0;
      z-index: 100;
    }
  </style>
</head>
<body>
  <svg id="map"></svg>
  <div id="tooltip" class="tooltip"></div>

  <div class="controls">
  <button class="back-btn" id="backBtn">← Back to India</button>
  <button id="customBackBtn" style="background:#ffc107; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-weight:bold; margin-left:10px;">
    Back
  </button>
  <div class="title" id="mapTitle">India - States & Union Territories</div>
</div>

  <script>
    
    document.getElementById("customBackBtn").onclick = () => {
    window.location.href = "index.html";
  };
    const width = window.innerWidth;
    const height = window.innerHeight - 50;

    const svg = d3.select("#map").attr("width", width).attr("height", height);
    const g = svg.append("g");
    const tooltip = d3.select("#tooltip");
    const backBtn = d3.select("#backBtn");
    const mapTitle = d3.select("#mapTitle");

    let currentLevel = "state";
    let currentStateName = null;
    let stateData = null;

    const zoom = d3.zoom()
      .scaleExtent([1, 8])
      .on("zoom", (event) => g.attr("transform", event.transform));

    svg.call(zoom);

    // const stateURL = "india_state_edited.geojson";
    const stateURL = "india_final.geojson";
    
    districtURLs = {
    "Andhra Pradesh": "andhra_pradesh.geojson",
    "Arunachal Pradesh": "arunachal_pradesh.geojson",
    "Assam": "assam.geojson",
    "Bihar": "bihar.geojson",
    "Chhattisgarh": "chhattisgarh.geojson",
    "Goa": "goa.geojson",
    "Gujarat": "gujarat.geojson",
    "Haryana": "haryana.geojson",
    "Himachal Pradesh": "himachal_pradesh.geojson",
    "Jharkhand": "jharkhand.geojson",
    "Karnataka": "karnataka.geojson",
    "Kerala": "kerala.geojson",
    "Madhya Pradesh": "madhya_pradesh.geojson",
    "Maharashtra": "maharashtra.geojson",
    "Manipur": "manipur.geojson",
    "Meghalaya": "meghalaya.geojson",
    "Mizoram": "mizoram.geojson",
    "Nagaland": "nagaland.geojson",
    "Odisha": "odisha.geojson",
    "Punjab": "punjab.geojson",
    "Rajasthan": "rajasthan.geojson",
    "Sikkim": "sikkim.geojson",
    "Tamil Nadu": "tamil_nadu.geojson",
    "Telangana": "telangana.geojson",
    "Tripura": "tripura.geojson",
    "Uttar Pradesh": "uttar_pradesh.geojson",
    "Uttarakhand": "uttarakhand.geojson",
    "West Bengal": "west_bengal.geojson",
    "Delhi": "delhi.geojson",
    "Puducherry": "puducherry.geojson",
    "Ladakh": "ladakh.geojson",
    "Jammu and Kashmir": "jammu_and_kashmir.geojson"
}

    function loadStateMap() {
      d3.json(stateURL).then((data) => {
        stateData = data;
        g.selectAll("*").remove();

        const projection = d3.geoMercator().fitSize([width, height], data);
        const path = d3.geoPath().projection(projection);

        g.selectAll("path")
          .data(data.features)
          .enter()
          .append("path")
          .attr("d", path)
          .attr("class", "state")
          .on("mouseover", (event, d) => {
            tooltip.style("opacity", 1)
              .html(d.properties.NAME_1 || d.properties.st_nm)
              .style("left", event.pageX + 10 + "px")
              .style("top", event.pageY - 20 + "px");
          })
          .on("mousemove", (event) => {
            tooltip.style("left", event.pageX + 10 + "px")
              .style("top", event.pageY - 20 + "px");
          })
          .on("mouseout", () => tooltip.style("opacity", 0))
          .on("click", (event, d) => {
            event.stopPropagation();
            const stateName = d.properties.NAME_1 || d.properties.st_nm;
            zoomToStateAndLoadDistricts(stateName, d, path);
          });

        currentLevel = "state";
        backBtn.classed("active", false);
        mapTitle.text("India - States & Union Territories");
        svg.on(".zoom", null);
      })
      .catch((error) => console.error("Error loading state map:", error));
    }


    function zoomToStateAndLoadDistricts(stateName, stateFeature, path) {
      const bounds = path.bounds(stateFeature);
      const [[x0, y0], [x1, y1]] = bounds;
      const dx = x1 - x0;
      const dy = y1 - y0;
      const x = (x0 + x1) / 2;
      const y = (y0 + y1) / 2;
      const scale = Math.max(1, Math.min(8, 0.9 / Math.max(dx / width, dy / height)));
      const translate = [width / 2 - scale * x, height / 2 - scale * y];

      svg.transition()
        .duration(1000)
        .call(
          zoom.transform,
          d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
        )
        .on("end", () => loadDistrictMap(stateName));
    }
function loadDistrictMap(stateName) {
  const districtURL = districtURLs[stateName];

  if (!districtURL) {
    alert(`District map not available for ${stateName}`);
    return;
  }

  d3.json(districtURL).then((districtData) => {
    g.selectAll("*").remove();

    const projection = d3.geoMercator().fitSize([width, height], districtData);
    const path = d3.geoPath().projection(projection);

    g.selectAll("path")
      .data(districtData.features)
      .enter()
      .append("path")
      .attr("d", path)
      .attr("class", "district")
      .on("mouseover", (event, d) => {
        tooltip.style("opacity", 1)
          .html(d.properties.district || d.properties.DISTRICT || d.properties.name || "District")
          .style("left", event.pageX + 10 + "px")
          .style("top", event.pageY - 20 + "px");
      })
      .on("click", (event, d) => {
        const distName = (d.properties.district || d.properties.DISTRICT || d.properties.name || "").trim();
        // Navigate to new page passing the district name as URL param
       window.location.href = `district_details.html?state=${encodeURIComponent(stateName)}&district=${encodeURIComponent(distName)}`;
      })
      .on("mousemove", (event) => {
        tooltip.style("left", event.pageX + 10 + "px")
          .style("top", event.pageY - 20 + "px");
      })
      .on("mouseout", () => tooltip.style("opacity", 0));

    currentLevel = "district";
    currentStateName = stateName;
    backBtn.classed("active", true);
    mapTitle.text(`${stateName} - Districts`);

    // Reset zoom
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
  })
  .catch((error) => {
    console.error(`Error loading district map for ${stateName}:`, error);
    alert(`Failed to load district map for ${stateName}`);
  });
}

    backBtn.on("click", () => {
      loadStateMap();
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    });

    function getParam(param) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}
const paramState = getParam('state');
if (paramState && paramState !== "null") {
  currentStateName = paramState;
  loadDistrictMap(paramState); // This will show the districts view!
} else {
  loadStateMap();
}

  </script>
</body>
</html>
