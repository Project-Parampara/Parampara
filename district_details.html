<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>District Details</title>
  <style>
    body {
      font-family: Arial, sans-serif; 
      padding: 16px; 
      margin: 0;
      min-height: 100vh;
      position: relative;
      background: transparent !important;
      z-index: 1;
    }
    .bg-image-district {
      position: fixed;
      left: 0; top: 0; width: 100vw; height: 100vh;
      z-index: 0;
      opacity: 0.85;
      filter: blur(2.2px) brightness(0.93) saturate(1.1);
      pointer-events: none;
      background: #f2f2f2;
      background-size: cover;
      background-position: center;
      transition: background-image 0.8s, opacity 0.5s;
    }
     .content-wrapper {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.13);
      backdrop-filter: blur(2.2px);
      padding: 20px 10px 24px 10px;
      border-radius: 16px;
      max-width: 1100px;
      margin: 0 auto;
      min-height: 96vh;
    }
    h2 { color: white; margin-top: 8px;}
    .site-buttons-container {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 16px;
      margin-bottom: 30px;
      justify-content: left;
      min-height: 80px;
    }
    
    .site-button {
      background: linear-gradient(90deg, #1976d2 0%, #64b5f6 100%);
      color: white;
      border: none;
      padding: 16px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 2px 8px rgba(44,44,44,0.09);
      transition: transform 0.16s, background 0.18s, box-shadow 0.14s;
      cursor: pointer;
      min-width: 170px;
      margin: 0;
      outline: none;
      letter-spacing: 0.5px;
    }
    .site-button:hover, .site-button:focus {
      background: linear-gradient(90deg, #42a5f5 0%, #1976d2 100%);
      color: #ffe082;
      box-shadow: 0 4px 20px 0 rgba(60,60,100,0.13);
      transform: scale(1.05);
    }
    .back-btn {
      display: inline-block;
      background: #555;
      color: white;
      padding: 7px 16px;
      border-radius: 4px;
      text-decoration: none;
      margin-bottom: 14px;
      cursor: pointer;
    }
     .back-btn:hover { 
        background: #333;
    }

    form h3 {
      margin: 0 0 12px 0;
      font-weight: 600;
      color: #333;
    }
    form input, form button {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    form button {
      background: #4caf50;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    form button:hover { background: #45a049; }
    .loading { color: #666; font-style: italic;}
    .error {
      color: #d32f2f;
      background: #ffebee;
      padding: 12px;
      border-radius: 4px;
      border-left: 4px solid #d32f2f;
    }
    @media (max-width: 650px){
      .site-buttons-container { gap: 8px; }
      .site-button { min-width: 130px; padding: 11px 8px; font-size: 0.97rem; }
      form { max-width: 99vw; }
      .content-wrapper { padding: 7px 0 13px 0;}
    }
  </style>
</head>
<body>
  <div id="bgDistrict" class="bg-image-district"></div>
  <div class="content-wrapper">
    <button class="back-btn" id="backBtn">← Back to Districts</button>
    <h2 id="district-title">Loading...</h2>
    <div class="site-buttons-container" id="sites">
      <p class="loading">Loading sites...</p>
    </div>
    <form id="addSiteForm">
      <h3>Suggest a New Site</h3>
      <input type="text" name="siteName" placeholder="Site Name" required />
      <input type="text" name="description" placeholder="Description" />
      <input type="url" name="imageUrl" placeholder="Image URL (optional)" />
      <button type="submit">Add Site</button>
    </form>
  </div>
   <script>
  const stateImages = {
    "Andhra Pradesh": "images/andhra pradesh.jpg",
    "Arunachal Pradesh": "images/arunachal pradesh.jpg",
    "Assam": "images/assam.jpg",
    "Bihar": "images/bihar.jpg",
    "Chhattisgarh": "images/chhattisgarh.jpg",
    "Goa": "images/goa.jpg",
    "Gujarat": "images/gujarat.jpg",
    "Haryana": "images/haryana.jpg",
    "Himachal Pradesh": "images/himachal pradesh.jpg",
    "Jharkhand": "images/jharkhand.jpg",
    "Karnataka": "images/karnataka.jpg",
    "Kerala": "images/kerala.jpg",
    "Madhya Pradesh": "images/madhya pradesh.jpg",
    "Maharashtra": "images/maharashtra.jpg",
    "Manipur": "images/manipur.jpg",
    "Meghalaya": "images/meghalaya.jpg",
    "Mizoram": "images/mizoram.jpg",
    "Nagaland": "images/nagaland.jpg",
    "Odisha": "images/orissa.jpg",
    "Punjab": "images/punjab.jpg",
    "Rajasthan": "images/rajastan.jpg",
    "Sikkim": "images/sikkim.jpg",
    "Tamil Nadu": "images/tamil nadu.jpg",
    "Telangana": "images/telangana.png",
    "Tripura": "images/tripura.jpg",
    "Uttar Pradesh": "images/uttar pradesh.jpg",
    "Uttarakhand": "images/uttarakhand.jpg",
    "West Bengal": "images/west bengal.jpg",
    "Delhi": "images/delhi.jpg",
    "Jammu and Kashmir": "images/jammu kashmir.jpg"
  };

  function getParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name)?.trim();
  }

  const districtName = getParam('district');
  const stateName = getParam('state');

  function setBackgroundForState(state) {
    const bgDiv = document.getElementById("bgDistrict");
    const img = stateImages[state] || "images/india.jpeg";
    bgDiv.style.backgroundImage = `url('${img}')`;
  }

  setBackgroundForState(stateName);

  if (!districtName || !stateName) {
    document.getElementById('sites').innerHTML = '<p class="error">Missing district or state in URL.</p>';
    document.getElementById('district-title').textContent = 'Error';
  } else {
    document.getElementById('district-title').textContent = `${districtName} - All Sites`;
  }

  document.getElementById('backBtn').onclick = () => {
    if (stateName) {
      window.location.href = `tr2.html?state=${encodeURIComponent(stateName)}`;
    } else {
      window.history.back();
    }
  };

  // ✅ Load sites from backend
  fetch(`http://localhost:3000/api/sites?state=${encodeURIComponent(stateName)}&district=${encodeURIComponent(districtName)}`)
    .then(res => res.json())
    .then(data => {
      console.log("Fetched data:", data);
      const container = document.getElementById('sites');
      container.innerHTML = "";

      if (!Array.isArray(data) || data.length === 0) {
        container.innerHTML = "<p>No site data available for this district.</p>";
      } else {
        data.forEach(site => {
          const siteName = site.site_name || site.siteName || "Unnamed Site";
          const button = document.createElement('button');
          button.className = "site-button";
          button.textContent = siteName;
          button.onclick = () => {
            window.location.href = `site_detail.html?district=${encodeURIComponent(districtName)}&site=${encodeURIComponent(siteName)}`;
          };
          container.appendChild(button);
        });
      }
    })
    .catch(err => {
      console.error('Error loading site data:', err);
      document.getElementById('sites').innerHTML = '<p>Error loading site data.</p>';
    });
// ✅ Add new site
const addSiteForm = document.getElementById('addSiteForm');
addSiteForm.onsubmit = async function (e) {
  e.preventDefault();

  const formData = new FormData(addSiteForm);
  const data = {
    siteName: (formData.get('siteName') || '').trim(),
    description: (formData.get('description') || '').trim(),
    imageUrl: (formData.get('imageUrl') || '').trim(),
    district: districtName,
    state: stateName
  };

  try {
    // <-- Make sure this matches the port your server actually listens on (3000 by default)
    const res = await fetch('http://localhost:3000/api/add-site', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',                // optional: include cookies/session if you need them
      body: JSON.stringify(data),
    });

    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status} ${res.statusText} ${text}`);
    }

    const result = await res.json();

    if (result.success) {
      alert('Site added successfully!');
      addSiteForm.reset();
    } else {
      alert('Failed to add site: ' + (result.error || 'Unknown error'));
    }
  } catch (err) {
    console.error('Error in addSiteForm.onsubmit:', err);
    alert('Error: ' + err.message);
  }
};


</script>
</body>
</html>
